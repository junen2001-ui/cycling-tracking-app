name: breakfast-ride-planner
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: breakfast-ride-planner-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: breakfast_ride_planner
    ports:
      - "5433:5432"
    volumes:
      - breakfast_ride_planner_pgdata:/var/lib/postgresql/data

volumes:
  breakfast_ride_planner_pgdata:
